<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Loki — Task Manager</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d30;--panel2:#1d2940;--text:#f4f7ff;--muted:#9aa8c2;--accent:#8b7cff;--line:#2a3853;--green:#38c996;--red:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182343 0,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#9b8cff,#4b9cff);display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 8px 28px #665bff55}.brand h1{font-size:25px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
button,input,select{font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer}.btn.primary{background:var(--accent);border-color:transparent;color:white;font-weight:700}.btn:active{transform:scale(.98)}
.hero{background:linear-gradient(120deg,#5146a8,#273d70);padding:20px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.hero h2{font-size:23px;margin:5px 0}.stats{display:flex;gap:10px;margin-top:15px}.stat{background:#ffffff18;padding:9px 13px;border-radius:12px;min-width:85px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;opacity:.8}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.panel h3{margin:0 0 13px;font-size:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;min-width:0;background:#0d1527;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);outline:none}.field:focus{border-color:var(--accent)}.wide{grid-column:1/-1}.form-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.toolbar .field{flex:1;min-width:130px}.task{display:flex;align-items:flex-start;gap:11px;padding:13px 3px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:22px;height:22px;accent-color:var(--green);margin-top:2px;flex:none}.taskmain{flex:1;min-width:0}.tasktitle{font-weight:650;overflow-wrap:anywhere}.task.done .tasktitle{text-decoration:line-through;color:var(--muted)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}.tag{background:#283552;padding:3px 8px;border-radius:20px}.taskbuttons{display:flex;gap:5px}.iconbtn{background:transparent;border:0;color:var(--muted);padding:5px;cursor:pointer;font-size:17px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
@media(max-width:480px){.wrap{padding:18px 12px 35px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{gap:7px}.stat{flex:1;min-width:0;padding:8px}.top .btn{padding:8px 10px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">L</div><div><h1>Loki</h1><p id="subtitle">مدیریت ساده و هوشمند کارها</p></div></div><button class="btn" id="langBtn">English</button></header>
<section class="hero"><small id="todayLabel">امروز</small><h2 id="greeting">کارهای امروزت رو مرتب کن ✨</h2><div class="stats"><div class="stat"><b id="total">0</b><span id="totalLabel">همه کارها</span></div><div class="stat"><b id="done">0</b><span id="doneLabel">انجام‌شده</span></div><div class="stat"><b id="left">0</b><span id="leftLabel">باقی‌مانده</span></div></div></section>
<section class="panel"><h3 id="formTitle">＋ افزودن کار جدید</h3><form id="taskForm"><div class="formgrid"><input class="field wide" id="taskTitle" maxlength="100" required placeholder="عنوان کار..." /><input class="field" id="taskDate" type="date"><select class="field" id="priority"><option value="normal">معمولی</option><option value="high">مهم</option><option value="low">کم‌اهمیت</option></select></div><div class="form-actions"><button class="btn primary" id="saveBtn" type="submit">افزودن کار</button><button class="btn" id="cancelEdit" type="button" hidden>لغو</button></div></form></section>
<div class="toolbar"><input class="field" id="search" placeholder="جست‌وجوی کارها..." /><select class="field" id="filter"><option value="all">همه</option><option value="active">در انتظار</option><option value="done">انجام‌شده</option></select></div>
<section class="panel"><h3 id="listTitle">فهرست کارها</h3><div id="tasks"></div></section>
<p class="foot">Loki · Your day, organized.</p>
</div>
<script>
const $=id=>document.getElementById(id);
let tasks=JSON.parse(localStorage.getItem('loki_tasks')||'[]'),editing=null,lang=localStorage.getItem('loki_lang')||'fa';
const words={fa:{subtitle:'مدیریت ساده و هوشمند کارها',today:'امروز',greeting:'کارهای امروزت رو مرتب کن ✨',all:'همه کارها',done:'انجام‌شده',left:'باقی‌مانده',form:'＋ افزودن کار جدید',title:'عنوان کار...',normal:'معمولی',high:'مهم',low:'کم‌اهمیت',add:'افزودن کار',save:'ذخیره تغییرات',cancel:'لغو',search:'جست‌وجوی کارها...',filterAll:'همه',active:'در انتظار',filterDone:'انجام‌شده',list:'فهرست کارها',empty:'هنوز کاری ثبت نکردی. اولین کارت رو اضافه کن!',todayDate:'بدون تاریخ',edit:'ویرایش',del:'حذف',confirm:'این کار حذف شود؟',priority:'اولویت'},en:{subtitle:'Simple, smart task management',today:'Today',greeting:'Make room for what matters ✨',all:'All tasks',done:'Completed',left:'Remaining',form:'＋ Add a new task',title:'Task title...',normal:'Normal',high:'Important',low:'Low priority',add:'Add task',save:'Save changes',cancel:'Cancel',search:'Search tasks...',filterAll:'All',active:'Pending',filterDone:'Completed',list:'Your tasks',empty:'No tasks yet. Add your first one!',todayDate:'No date',edit:'Edit',del:'Delete',confirm:'Delete this task?',priority:'Priority'}};
function t(k){return words[lang][k]}function persist(){localStorage.setItem('loki_tasks',JSON.stringify(tasks));render()}
function setupLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('langBtn').textContent=lang==='fa'?'English':'فارسی';$('subtitle').textContent=t('subtitle');$('todayLabel').textContent=t('today');$('greeting').textContent=t('greeting');$('totalLabel').textContent=t('all');$('doneLabel').textContent=t('done');$('leftLabel').textContent=t('left');$('formTitle').textContent=editing===null?t('form'):(lang==='fa'?'✎ ویرایش کار':'✎ Edit task');$('taskTitle').placeholder=t('title');$('priority').options[0].text=t('normal');$('priority').options[1].text=t('high');$('priority').options[2].text=t('low');$('saveBtn').textContent=editing===null?t('add'):t('save');$('cancelEdit').textContent=t('cancel');$('search').placeholder=t('search');$('filter').options[0].text=t('filterAll');$('filter').options[1].text=t('active');$('filter').options[2].text=t('filterDone');$('listTitle').textContent=t('list')}
function render(){setupLang();$('total').textContent=tasks.length;$('done').textContent=tasks.filter(x=>x.done).length;$('left').textContent=tasks.filter(x=>!x.done).length;let q=$('search').value.toLowerCase(),f=$('filter').value;let shown=tasks.filter(x=>x.title.toLowerCase().includes(q)&&(f==='all'||(f==='done'?x.done:!x.done)));$('tasks').innerHTML='';if(!shown.length){$('tasks').innerHTML='<div class="empty">'+t('empty')+'</div>';return}shown.sort((a,b)=>Number(a.done)-Number(b.done));for(let x of shown){let el=document.createElement('div');el.className='task'+(x.done?' done':'');let check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=x.done;check.addEventListener('change',()=>{x.done=check.checked;persist()});let main=document.createElement('div');main.className='taskmain';let title=document.createElement('div');title.className='tasktitle';title.textContent=x.title;let meta=document.createElement('div');meta.className='meta';let date=document.createElement('span');date.className='tag';date.textContent=x.date||t('todayDate');let pri=document.createElement('span');pri.className='tag';pri.textContent=t(x.priority);meta.append(date,pri);main.append(title,meta);let buttons=document.createElement('div');buttons.className='taskbuttons';let edit=document.createElement('button');edit.className='iconbtn';edit.textContent='✎';edit.title=t('edit');edit.onclick=()=>startEdit(x.id);let del=document.createElement('button');del.className='iconbtn';del.textContent='×';del.title=t('del');del.onclick=()=>{if(confirm(t('confirm'))){tasks=tasks.filter(z=>z.id!==x.id);persist()}};buttons.append(edit,del);el.append(check,main,buttons);$('tasks').append(el)}}
function startEdit(id){let x=tasks.find(z=>z.id===id);editing=id;$('taskTitle').value=x.title;$('taskDate').value=x.date;$('priority').value=x.priority;$('cancelEdit').hidden=false;setupLang();$('taskTitle').focus()}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();let title=$('taskTitle').value.trim();if(!title)return;if(editing!==null){let x=tasks.find(z=>z.id===editing);x.title=title;x.date=$('taskDate').value;x.priority=$('priority').value}else tasks.unshift({id:Date.now(),title,date:$('taskDate').value,priority:$('priority').value,done:false});editing=null;$('taskForm').reset();$('cancelEdit').hidden=true;persist()});
$('cancelEdit').onclick=()=>{editing=null;$('taskForm').reset();$('cancelEdit').hidden=true;render()};$('langBtn').onclick=()=>{lang=lang==='fa'?'en':'fa';localStorage.setItem('loki_lang',lang);render()};$('search').oninput=render;$('filter').onchange=render;
render();
</script>
</body></html>
